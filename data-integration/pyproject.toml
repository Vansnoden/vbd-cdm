[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vbd-cdm"
version = "1.0.0"
description = "Auditable integration of heterogeneous vector-borne disease data into a common data model"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Salvador D. Atagong" }]
keywords = [
  "vector-borne disease", "data integration", "common data model",
  "vocabulary", "provenance", "reproducibility", "malaria", "entomology",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: GIS",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
# Core runtime only. Everything geospatial/raster/climate is an extra, so a
# reader can install and run the tests without GDAL, ECCodes or Biopython.
dependencies = [
  "SQLAlchemy>=2.0.25",
  "alembic>=1.13",
  "pandas>=2.1",
  "numpy>=1.26",
  "PyYAML>=6.0",
  "pydantic>=2.6",
  "python-dotenv>=1.0",
  "rapidfuzz>=3.6",
  "requests>=2.31",
]

[project.optional-dependencies]
geo = ["geopandas>=0.14", "shapely>=2.0", "pyogrio>=0.7", "reverse_geocode>=1.5.1"]
raster = ["rasterio>=1.3", "rioxarray>=0.15", "xarray>=2023.10"]
climate = ["cfgrib>=0.9.10"]
stats = ["pyreadstat>=1.2"]
taxa = ["biopython>=1.81"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]
docs = ["sphinx>=7.2", "furo>=2024.1", "myst-parser>=2.0", "sphinx-markdown-builder>=0.6"]
all = [
  "geopandas>=0.14", "shapely>=2.0", "pyogrio>=0.7", "reverse_geocode>=1.5.1",
  "rasterio>=1.3", "rioxarray>=0.15", "xarray>=2023.10",
  "cfgrib>=0.9.10", "pyreadstat>=1.2", "biopython>=1.81",
  "pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5",
  "sphinx>=7.2", "furo>=2024.1", "myst-parser>=2.0", "sphinx-markdown-builder>=0.6",
]

[project.urls]
Homepage = "https://github.com/CHANGE-ME/vbd-cdm"
Issues = "https://github.com/CHANGE-ME/vbd-cdm/issues"
Documentation = "https://github.com/CHANGE-ME/vbd-cdm/tree/main/docs"

[tool.setuptools.packages.find]
include = ["database*", "etl*", "utilities*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "error::DeprecationWarning:vbd_cdm.*",
  "default",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.coverage.run]
source = ["database", "etl", "utilities"]
omit = ["*/tests/*"]

[tool.coverage.report]
skip_empty = true