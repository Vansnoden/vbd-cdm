pack_id: burden-expansion
version: "1.0.0"
released_with: "1.2"

burden_expansion:
  description: >-
    Allocation and selection policy for the modelled daily case series. Every key
    here changes a stored number, so every key is read from this one block and
    nothing outside it.

  source: >-
    TODO: cite the source of these weights, or delete `seasonality` to allocate
    uniformly. A seasonal claim drawn from a series generated under this pack is
    unsupported until this names a citation.

  seasonality:
    "1": 1.35
    "2": 1.25
    "3": 1.20
    "4": 1.05
    "5": 0.95
    "6": 0.80
    "7": 0.70
    "8": 0.75
    "9": 0.85
    "10": 1.00
    "11": 1.20
    "12": 1.30

  weekly_pattern:
    "6": 1.10
    "7": 1.15

  intra_month_amplitude: 0.15
  base_variation: 0.0
  spike_probability: 0.0
  spike_mean_excess: 0.5

  measure:
    prefer: cases_mean
    rate_scale: per_100k

  denominator:
    indicator: SP.POP.TOTL
    national_allocation: true

  write:
    grain: admin2
    seed: 42
    force: false

  selection:
    years: null
    locations: null
    limit: null