# base_config.yaml
#
# Kenya case-study configuration for the VBD CDM.
#
# Layout:
#   core          : paths to shared resources (vocabulary CSV)
#   data_sources  : one block per ingested file or folder, grouped by domain
#   process       : pipeline steps, in order
#
# Each data_source block declares:
#   source_name        : human-readable provenance label
#   type               : "file" or "folder"
#   extension          : source file extension (without dot)
#   path               : absolute path to file or folder
#   extension_options  : passed straight to the extractor for that format
#   matching           : mapping CSV, relative to the project root
#   extract_mode       : "single" | "timeseries" | "chunked"
#
# Mapping-file naming: <source>_<target>.mapping.csv. A source that writes
# to more than one target column, or that represents a distinct disease or
# indicator, MUST have its own mapping file. Reusing one mapping across
# multiple sources causes the last-loaded source to overwrite the previous
# at the shared natural key.

core:
  vocabulary: "data/vocabulary.csv"
  # study_region: "Siaya"
  # study_period: "2019-2025"

data_sources:

  # =========================================================================
  # 1. VECTOR OCCURRENCE
  # =========================================================================

  vectoratlas:
    source_name: "Vector Atlas Occurrence"
    type: "file"
    extension: "csv"
    path: "/mnt/monadworld/projects/phd/article_manuscripts/a_cdm_for_vector_of_vbds/data/datasets/siaya_county_data/occurrence/va_data_filtered_species.csv"
    extension_options:
      sep: ","
      quotechar: '"'
      encoding: "utf-8"
      on_bad_lines: "warn"
      engine: "python"
    matching: "mappings/vectoratlas.mapping.csv"
    extract_mode: "single"

  gbif:
    source_name: "GBIF Occurrence"
    type: "file"
    extension: "csv"
    path: "/mnt/monadworld/projects/phd/article_manuscripts/a_cdm_for_vector_of_vbds/data/datasets/siaya_county_data/occurrence/kenya_funestus_gambiae_stephensi_GBIF.csv"
    extension_options:
      sep: "\t"
      quotechar: '"'
      encoding: "utf-8"
      on_bad_lines: "warn"
      engine: "python"
    matching: "mappings/gbif_occurrence.mapping.csv"
    extract_mode: "single"

  # =========================================================================
  # 2. INSECTICIDE RESISTANCE (IRMapper — eight source files)
  # =========================================================================

  irmapper_ir_1:
    source_name: "IRMapper 1: WHO susceptibility, complex/subgroup"
    type: "file"
    extension: "csv"
    path: "/mnt/monadworld/projects/phd/article_manuscripts/a_cdm_for_vector_of_vbds/data/datasets/siaya_county_data/resistance/1_standard_who_susc_test_complex_subgroup.csv"
    extension_options:
      sep: ","
      quotechar: '"'
      encoding: "utf-8"
      on_bad_lines: "warn"
      engine: "python"
    matching: "mappings/irmapper_1.mapping.csv"
    extract_mode: "single"

  irmapper_ir_2:
    source_name: "IRMapper 2: WHO susceptibility, species"
    type: "file"
    extension: "csv"
    path: "/mnt/monadworld/projects/phd/article_manuscripts/a_cdm_for_vector_of_vbds/data/datasets/siaya_county_data/resistance/2_standard_who_susc_test_species.csv"
    extension_options:
      sep: ","
      quotechar: '"'
      encoding: "utf-8"
      on_bad_lines: "warn"
      engine: "python"
    matching: "mappings/irmapper_2.mapping.csv"
    extract_mode: "single"

  irmapper_ir_3:
    source_name: "IRMapper 3: CDC bottle bioassay, complex/subgroup"
    type: "file"
    extension: "csv"
    path: "/mnt/monadworld/projects/phd/article_manuscripts/a_cdm_for_vector_of_vbds/data/datasets/siaya_county_data/resistance/3_CDC-bottle-bioassay_complex-subgroup.csv"
    extension_options:
      sep: ","
      quotechar: '"'
      encoding: "utf-8"
      on_bad_lines: "warn"
      engine: "python"
    matching: "mappings/irmapper_3.mapping.csv"
    extract_mode: "single"

  irmapper_ir_4:
    source_name: "IRMapper 4: paired synergist bioassays, complex/subgroup"
    type: "file"
    extension: "csv"
    path: "/mnt/monadworld/projects/phd/article_manuscripts/a_cdm_for_vector_of_vbds/data/datasets/siaya_county_data/resistance/4_paired_synergist_bioassays_complex_subgroup.csv"
    extension_options:
      sep: ","
      quotechar: '"'
      encoding: "utf-8"
      on_bad_lines: "warn"
      engine: "python"
    matching: "mappings/irmapper_4.mapping.csv"
    extract_mode: "single"

  irmapper_ir_5:
    source_name: "IRMapper 5: intensity bioassay, complex/subgroup"
    type: "file"
    extension: "csv"
    path: "/mnt/monadworld/projects/phd/article_manuscripts/a_cdm_for_vector_of_vbds/data/datasets/siaya_county_data/resistance/5_intensity_bioassay_complex_subgroup.csv"
    extension_options:
      sep: ","
      quotechar: '"'
      encoding: "utf-8"
      on_bad_lines: "warn"
      engine: "python"
    matching: "mappings/irmapper_5.mapping.csv"
    extract_mode: "single"

  # -------------------------------------------------------------------------
  # IRMapper 6, 7, 8 are VGSC genotype-count files. They describe resistance
  # tests, NOT vector observations. Their mapping files should write ONLY
  # to fact_insecticide_resistance (with vgsc_* counts and vgsc_generation),
  # and must NOT write to fact_vector_observation. The latter's natural key
  # (location_id, date_id, vector_code, source_code, life_stage, sex,
  # collection_method) collides across multiple VGSC rows at the same
  # site-species-date, and the loader's upsert would silently keep only the
  # last row's `count`.
  # -------------------------------------------------------------------------

  irmapper_ir_6:
    source_name: "IRMapper 6: VGSC allele frequency, complex/subgroup"
    type: "file"
    extension: "csv"
    path: "/mnt/monadworld/projects/phd/article_manuscripts/a_cdm_for_vector_of_vbds/data/datasets/siaya_county_data/resistance/6_Vgsc-allele-freq_complex-subgroup.csv"
    extension_options:
      sep: ","
      quotechar: '"'
      encoding: "utf-8"
      on_bad_lines: "warn"
      engine: "python"
    matching: "mappings/irmapper_6.mapping.csv"
    extract_mode: "single"

  irmapper_ir_7:
    source_name: "IRMapper 7: VGSC allele frequency, species"
    type: "file"
    extension: "csv"
    path: "/mnt/monadworld/projects/phd/article_manuscripts/a_cdm_for_vector_of_vbds/data/datasets/siaya_county_data/resistance/7_Vgsc-allele-freq_species.csv"
    extension_options:
      sep: ","
      quotechar: '"'
      encoding: "utf-8"
      on_bad_lines: "warn"
      engine: "python"
    matching: "mappings/irmapper_7.mapping.csv"
    extract_mode: "single"

  irmapper_ir_8:
    source_name: "IRMapper 8: VGSC allele frequency, survivors vs dead"
    type: "file"
    extension: "csv"
    path: "/mnt/monadworld/projects/phd/article_manuscripts/a_cdm_for_vector_of_vbds/data/datasets/siaya_county_data/resistance/8_Vgsc-allele-freq_survivors-dead.csv"
    extension_options:
      sep: ","
      quotechar: '"'
      encoding: "utf-8"
      on_bad_lines: "warn"
      engine: "python"
    matching: "mappings/irmapper_8.mapping.csv"
    extract_mode: "single"

  # =========================================================================
  # 3. CLIMATE (ERA5-Land, NetCDF)
  # =========================================================================

  climate_timeseries:
    source_name: "ERA5-Land Climate"
    type: "folder"
    extension: "nc"
    path: "/mnt/monadworld/projects/phd/article_manuscripts/a_cdm_for_vector_of_vbds/data/datasets/siaya_county_data/climate"
    matching: "mappings/era5_climate.mapping.csv"
    extract_mode: "timeseries"

  # =========================================================================
  # 4. MALARIA BURDEN — Plasmodium falciparum (MAP)
  #
  # Each metric writes a distinct column in fact_disease_burden. Do NOT
  # reuse a single mapping across these sources; the upsert at
  # (location_id, year, disease_code, pathogen_species) would overwrite.
  #
  # Schema column mapping:
  #   Pf Incidence Count     -> cases_mean       (yearly case count), Pf
  #   Pf Incidence Rate      -> incidence_rate   (cases per 1,000 pop / yr), Pf
  #   Pf Parasite Rate       -> prevalence_rate  (proportion infected), Pf
  #   Pf Reproductive Number -> no schema column; commented out below
  # =========================================================================

  map_pf_incidence_count_ken:
    source_name: "MAP Pf Incidence Count (Kenya)"
    type: "folder"
    extension: "tiff"
    path: "/mnt/monadworld/projects/phd/article_manuscripts/a_cdm_for_vector_of_vbds/data/datasets/siaya_county_data/disease_incidence/Global_Pf_Incidence_Count_KEN"
    matching: "mappings/malariaatlas_pf_incidence_count.mapping.csv"
    extract_mode: "chunked"
    extension_options:
      band: 1
      window_size: 512
      nodata_threshold: -9999.0

  map_pf_incidence_rate_ken:
    source_name: "MAP Pf Incidence Rate (Kenya)"
    type: "folder"
    extension: "tiff"
    path: "/mnt/monadworld/projects/phd/article_manuscripts/a_cdm_for_vector_of_vbds/data/datasets/siaya_county_data/disease_incidence/Global_Pf_Incidence_Rate_KEN"
    matching: "mappings/malariaatlas_pf_incidence_rate.mapping.csv"
    extract_mode: "chunked"
    extension_options:
      band: 1
      window_size: 512
      nodata_threshold: -9999.0

  map_pf_parasite_rate_ken:
    source_name: "MAP Pf Parasite Rate (Kenya)"
    type: "folder"
    extension: "tiff"
    path: "/mnt/monadworld/projects/phd/article_manuscripts/a_cdm_for_vector_of_vbds/data/datasets/siaya_county_data/disease_incidence/Global_Pf_Parasite_Rate_KEN"
    matching: "mappings/malariaatlas_pf_parasite_rate.mapping.csv"
    extract_mode: "chunked"
    extension_options:
      band: 1
      window_size: 512
      nodata_threshold: -9999.0

  # -------------------------------------------------------------------------
  # MAP Pf Reproductive Number: no matching column in the current CDM.
  # Uncomment only after adding a `reproductive_number` column to
  # fact_disease_burden (requires an Alembic migration on the Python side).
  # -------------------------------------------------------------------------
  # map_pf_reproductive_number_ken:
  #   source_name: "MAP Pf Reproductive Number (Kenya)"
  #   type: "folder"
  #   extension: "tif"
  #   path: "/mnt/monadworld/projects/phd/article_manuscripts/a_cdm_for_vector_of_vbds/data/datasets/siaya_county_data/disease_incidence/Global_Pf_Reproductive_Number_KEN"
  #   matching: "mappings/malariaatlas_pf_reproductive_number.mapping.csv"
  #   extract_mode: "chunked"
  #   extension_options:
  #     band: 1
  #     window_size: 512
  #     nodata_threshold: -9999.0

  # =========================================================================
  # 5. MALARIA BURDEN — Plasmodium vivax (MAP)
  #
  # Uses the same disease_code = "MAL" as Pf. Distinguished by the
  # pathogen_species column ('Pv'). No dim_disease row is needed for Pv;
  # the FK still resolves against MAL.
  #
  # If the MAP Pv rasters are effectively empty for Kenya (as is typical),
  # these three sources will load zero or near-zero rows. Harmless; leave
  # them enabled if you want the data present in the CDM, comment them out
  # if you'd rather not carry the empty tables.
  # =========================================================================

  map_pv_incidence_count_ken:
    source_name: "MAP Pv Incidence Count (Kenya)"
    type: "folder"
    extension: "tiff"
    path: "/mnt/monadworld/projects/phd/article_manuscripts/a_cdm_for_vector_of_vbds/data/datasets/siaya_county_data/disease_incidence/Global_Pv_Incidence_Count_KEN"
    matching: "mappings/malariaatlas_pv_incidence_count.mapping.csv"
    extract_mode: "chunked"
    extension_options:
      band: 1
      window_size: 512
      nodata_threshold: -9999.0

  map_pv_incidence_rate_ken:
    source_name: "MAP Pv Incidence Rate (Kenya)"
    type: "folder"
    extension: "tiff"
    path: "/mnt/monadworld/projects/phd/article_manuscripts/a_cdm_for_vector_of_vbds/data/datasets/siaya_county_data/disease_incidence/Global_Pv_Incidence_Rate_KEN"
    matching: "mappings/malariaatlas_pv_incidence_rate.mapping.csv"
    extract_mode: "chunked"
    extension_options:
      band: 1
      window_size: 512
      nodata_threshold: -9999.0

  map_pv_parasite_rate_ken:
    source_name: "MAP Pv Parasite Rate (Kenya)"
    type: "folder"
    extension: "tiff"
    path: "/mnt/monadworld/projects/phd/article_manuscripts/a_cdm_for_vector_of_vbds/data/datasets/siaya_county_data/disease_incidence/Global_Pv_Parasite_Rate_KEN"
    matching: "mappings/malariaatlas_pv_parasite_rate.mapping.csv"
    extract_mode: "chunked"
    extension_options:
      band: 1
      window_size: 512
      nodata_threshold: -9999.0

  # =========================================================================
  # 6. HEALTH SYSTEM (Kenya Master Health Facility Registry)
  # =========================================================================

  health_facilities:
    source_name: "Kenya Health Facilities"
    type: "file"
    extension: "csv"
    path: "/mnt/monadworld/projects/phd/article_manuscripts/a_cdm_for_vector_of_vbds/data/datasets/siaya_county_data/health_facilities/kmhfr_facilities.csv"
    extension_options:
      sep: ","
      quotechar: '"'
      encoding: "utf-8"
      on_bad_lines: "warn"
      engine: "python"
    matching: "mappings/health_facility_location.mapping.csv"
    extract_mode: "single"

  # =========================================================================
  # 7. SOCIOECONOMIC (World Bank WDI, Kenya)
  # =========================================================================

  socioeconomic:
    source_name: "World Bank Kenya Indicators"
    type: "file"
    extension: "csv"
    path: "/mnt/monadworld/projects/phd/article_manuscripts/a_cdm_for_vector_of_vbds/data/datasets/siaya_county_data/socio_economics/Clean_Reorganized_API_KEN_DS2_en_csv_v2_10008.csv"
    extension_options:
      sep: ","
      quotechar: '"'
      encoding: "utf-8"
      on_bad_lines: "warn"
      engine: "python"
    matching: "mappings/worldbank_indicator.mapping.csv"
    extract_mode: "single"

  # =========================================================================
  # 8. INTERVENTIONS
  #
  # Two distinct provenance streams feed fact_intervention:
  #
  #   a) itnuse_data.csv — national time series, CSV
  #   b) MAP GeoTIFFs — sub-national yearly rasters, three variables
  #
  # The three raster sources use their own map_itn_*.mapping.csv files,
  # each of which writes to fact_intervention. The ITN mappings use
  # format_date to construct date_start / date_end from the year embedded
  # in each TIF's filename; the orchestrator injects a `year` column per
  # chunk before the transformer runs.
  # =========================================================================

  interventions:
    source_name: "ITN Use (itnuse.org)"
    type: "file"
    extension: "csv"
    path: "/mnt/monadworld/projects/phd/article_manuscripts/a_cdm_for_vector_of_vbds/data/datasets/siaya_county_data/intervention_data/itn_usage_data.csv"
    extension_options:
      sep: ","
      quotechar: '"'
      encoding: "utf-8"
      on_bad_lines: "warn"
      engine: "python"
    matching: "mappings/itnuse_data.mapping.csv"
    extract_mode: "single"

  map_itn_access_ken:
    source_name: "MAP ITN Access (Kenya)"
    type: "folder"
    extension: "tiff"
    path: "/mnt/monadworld/projects/phd/article_manuscripts/a_cdm_for_vector_of_vbds/data/datasets/siaya_county_data/intervention_data/map_itn_access_2000_2025"
    matching: "mappings/map_itn_access.mapping.csv"
    extract_mode: "chunked"
    extension_options:
      band: 1
      window_size: 512
      nodata_threshold: -9999.0

  map_itn_use_ken:
    source_name: "MAP ITN Use (Kenya)"
    type: "folder"
    extension: "tiff"
    path: "/mnt/monadworld/projects/phd/article_manuscripts/a_cdm_for_vector_of_vbds/data/datasets/siaya_county_data/intervention_data/map_itn_use_2000_2025"
    matching: "mappings/map_itn_use.mapping.csv"
    extract_mode: "chunked"
    extension_options:
      band: 1
      window_size: 512
      nodata_threshold: -9999.0

  map_itn_use_rate_ken:
    source_name: "MAP ITN Use/Access Ratio (Kenya)"
    type: "folder"
    extension: "tiff"
    path: "/mnt/monadworld/projects/phd/article_manuscripts/a_cdm_for_vector_of_vbds/data/datasets/siaya_county_data/intervention_data/map_itn_use_rate_2000_2025"
    matching: "mappings/map_itn_use_rate.mapping.csv"
    extract_mode: "chunked"
    extension_options:
      band: 1
      window_size: 512
      nodata_threshold: -9999.0

process:
  steps:
    - ingest_data
    - consolidate
    - generate_summary