data_sources:

  vectoratlas:
    source_name: "Vector Atlas Occurrence"
    type: "file"
    extension: "csv"
    path: "/home/void/Documents/research/phd/data/vbd-cdm/VA/CaseStudyData/VA_data_filtered_funestus_gambiae_kenya.csv"
    extension_options:
      sep: ","
      quotechar: '"'
      encoding: "utf-8"
      on_bad_lines: "error"      # 'warn' requires engine: python
      engine: "python"
    matching: "mappings/vectoratlas.mapping.csv"
    extract_mode: "single"

  gbif:
    source_name: "GBIF Occurrence"
    type: "file"
