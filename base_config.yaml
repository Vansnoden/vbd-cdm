core:
  vocabulary: "data/vocabulary.csv"

data_sources:
  source_1:
    source_name: 'source 1' # the name of the data source
    type: 'file' # or folder
    extension: 'csv' # one of 'cog,csv,dta,geojson,gpkg,grib,json,nc,nc4,sas7bdat,sav,shp,tif,tsv,xlsx,xml' accounting for all file in folder also
    extension_options: # these changes depending on the data source see ./docs/data_types.md
      sep: "\t"
    matching: 'matchings/<source_1>.matching.csv'
  source_2:
    source_name: 'source 2' # the name of the data source
    type: 'file' # or folder
    extension: 'csv' # one of 'cog,csv,dta,geojson,gpkg,grib,json,nc,nc4,sas7bdat,sav,shp,tif,tsv,xlsx,xml' accounting for all file in folder also
    extension_options: # these changes depending on the data source see ./docs/data_types.md
      var: "..."
    matching: 'matchings/<source_2>.matching.csv'

process:
  steps:
    - ingest_data
    - generate_summary
  analyze: # optional list of standardize analysis pipelines and applied filters
    filter: > # enable multiline string
      "table_name.field <operator> value 
      AND table_name.field <operator> value 
      OR table_name.field <operator> value"
    standard_pipelines:
      - standard_pipeline_1
      - standard_pipeline_2
      - standard_pipeline_3
      - standard_pipeline_4
      - standard_pipeline_5
