core:
  vocabulary: "data/vocabulary.csv"

data_sources:
  vector_occurrence:
    source_name: "Vector Occurrence"
    type: "file"
    extension: "csv"
    path: "/mnt/monadworld/projects/phd/article_manuscripts/a_cdm_for_vector_of_vbds/data/datasets/gbif/gbif_an_gambiae_africa/0044774-260226173443078.csv"
    extension_options:
      sep: "\t"
      quotechar: '"'
      encoding: "utf-8"
      on_bad_lines: "warn"
      engine: "python"
    matching: "mappings/occurrence.mapping.csv"
    extract_mode: "single"   # for tabular data

